<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  	<title>Simple Web Page</title>
  	<style>
  		body {
  			font-family: Ariel, Verdana, sans-serif;
  			background-color: white;
  		}
  		p {
  			padding: 10px;
  		}
  		#container {width:80%; margin: auto;}
  		.headcolor {
  			color: saddlebrown;
  			background-color: palegoldenrod;
  			padding: 10px;
  		}
  	</style>
    <script>
      function colorChange(){
        var div = document.getElementById("container");
        div.style.color = "saddlebrown";
        var p1 = document.getElementById("mypara1");
        p1.style.color = palegoldenrod;
        var p2 = document.getElementById("mypara2");
        p2.style.color = palegoldenrod;
      }
    </script>
  </head>
  <body onload="colorChange();">
  	<div id="container">
  		<header>
  			<h1 class="headcolor">Exercise 1</h1>
  		</header>
  		<main>
  			<h4 class="headcolor">Really Important Stuff</h4>
  			<p id="mypara1">1. Read about this exercise</p>
  			<p id="mypara2">2. Do it right</p>
  		</main>
  	</div>
  </body>
</html>
